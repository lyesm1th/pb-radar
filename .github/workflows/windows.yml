name: Windows tests and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q

  windows-build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Package radar and launcher
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PB-Radar --collect-all osmium run_app.py
          pyinstaller --noconfirm --clean --onefile --windowed --name PB-Radar-Launcher run_launcher.py
          Compress-Archive -Path dist/PB-Radar.exe -DestinationPath dist/PB-Radar-App.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PB-Radar-Windows
          path: |
            dist/PB-Radar-App.zip
            dist/PB-Radar-Launcher.exe
      - name: Publish version for launcher
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = python -c "from pbradar import __version__; print('v' + __version__)"
          gh release view "$version" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $version already exists. Bump pbradar.__version__ for a new release."
            exit 0
          }
          gh release create "$version" dist/PB-Radar-App.zip dist/PB-Radar-Launcher.exe --target "$env:GITHUB_SHA" --title "PB Radar $version" --generate-notes

