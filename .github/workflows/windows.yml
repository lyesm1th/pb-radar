name: Windows tests and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q

  windows-build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Prepare branded Windows icon
        run: python scripts/build_icon.py
      - name: Package radar and launcher
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --icon dist/PB-Radar.ico --name PB-Radar --collect-all osmium --collect-all customtkinter --add-data "pbradar/assets/ukraine-adm1.geojson;pbradar/assets" --add-data "pbradar/assets/polski-bramy-logo.png;pbradar/assets" --add-data "pbradar/assets/polski-bramy-mark.png;pbradar/assets" --add-data "pbradar/assets/pb-radar-icon.png;pbradar/assets" run_app.py
          pyinstaller --noconfirm --clean --onefile --windowed --icon dist/PB-Radar.ico --name PB-Radar-Launcher --add-data "pbradar/assets/pb-radar-icon.png;pbradar/assets" run_launcher.py
          Compress-Archive -Path dist/PB-Radar.exe -DestinationPath dist/PB-Radar-App.zip -Force
      - name: Build one-time Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
            else {
              choco install innosetup --no-progress -y
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
            }
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          $version = python -c "from pbradar import __version__; print(__version__)"
          & $iscc "/DMyAppVersion=$version" "installer/pb-radar.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: PB-Radar-Windows
          path: |
            dist/PB-Radar-App.zip
            dist/PB-Radar-Launcher.exe
            dist/PB-Radar-Setup.exe
      - name: Publish version for launcher
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = python -c "from pbradar import __version__; print('v' + __version__)"
          gh release view "$version" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $version already exists. Bump pbradar.__version__ for a new release."
            exit 0
          }
          gh release create "$version" dist/PB-Radar-App.zip dist/PB-Radar-Launcher.exe dist/PB-Radar-Setup.exe --target "$env:GITHUB_SHA" --title "PB Radar $version" --generate-notes

